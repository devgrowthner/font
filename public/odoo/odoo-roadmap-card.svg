<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <filter id="s" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#00000018"/>
    </filter>
  </defs>
  <!-- Dark card -->
  <rect width="480" height="200" rx="16" fill="#111827" filter="url(#s)"/>

  <!-- Header -->
  <circle cx="30" cy="28" r="14" fill="#1d4ed8"/>
  <text x="30" y="34" text-anchor="middle" font-family="'Helvetica Neue',sans-serif" font-size="12" font-weight="700" fill="#fff">Z</text>
  <text x="54" y="25" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#9ca3af">Zynex ERP Roadmap</text>
  <text x="54" y="40" font-family="'Helvetica Neue',sans-serif" font-size="13" font-weight="700" fill="#e5e7eb">Recommended next steps</text>

  <!-- Timeline items -->
  <!-- Phase 1 -->
  <circle cx="44" cy="76" r="8" fill="#719334"/>
  <text x="44" y="80" text-anchor="middle" font-family="'Helvetica Neue',sans-serif" font-size="9" font-weight="700" fill="#fff">1</text>
  <line x1="44" y1="84" x2="44" y2="104" stroke="#374151" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="60" y="74" font-family="'Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#e5e7eb">AI ERP Readiness Review</text>
  <text x="60" y="88" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#9ca3af">Week 1  ·  Identify gaps &amp; opportunities</text>

  <!-- Phase 2 -->
  <circle cx="44" cy="116" r="8" fill="#374151" stroke="#4b5563" stroke-width="1.5"/>
  <text x="44" y="120" text-anchor="middle" font-family="'Helvetica Neue',sans-serif" font-size="9" font-weight="700" fill="#9ca3af">2</text>
  <line x1="44" y1="124" x2="44" y2="144" stroke="#374151" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="60" y="114" font-family="'Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#9ca3af">Odoo ERP Deployment</text>
  <text x="60" y="128" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#6b7280">Weeks 4–12  ·  Full configuration &amp; go-live</text>

  <!-- Phase 3 -->
  <circle cx="44" cy="156" r="8" fill="#374151" stroke="#4b5563" stroke-width="1.5"/>
  <text x="44" y="160" text-anchor="middle" font-family="'Helvetica Neue',sans-serif" font-size="9" font-weight="700" fill="#9ca3af">3</text>
  <text x="60" y="154" font-family="'Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#9ca3af">AI Automation Layer</text>
  <text x="60" y="168" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#6b7280">Month 4+  ·  Reporting, alerts &amp; AI workflows</text>

  <!-- Footer -->
  <rect x="0" y="182" width="480" height="18" rx="0" fill="#0f172a"/>
  <text x="24" y="194" font-family="'Helvetica Neue',sans-serif" font-size="10" fill="#4b5563">zynextechnologies.com.au  ·  AI-powered ERP for Australian SMBs</text>
