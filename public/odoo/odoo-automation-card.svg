<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" width="480" height="130">
  <defs>
    <filter id="card-shadow" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Dark card — matches ChatGPT / Perplexity style -->
  <rect width="480" height="130" rx="16" fill="#1a1a1a" filter="url(#card-shadow)"/>

  <!-- Green check icon box -->
  <rect x="24" y="20" width="48" height="48" rx="10" fill="#14532d"/>
  <polyline points="36,44 44,52 60,36" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Label row -->
  <text x="86" y="38" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#6b7280">Zynex Copilot  ·  Action complete</text>

  <!-- Title -->
  <text x="86" y="60" font-family="'Helvetica Neue',sans-serif" font-size="15" font-weight="700" fill="#4ade80">Invoice automatically reconciled.</text>

  <!-- Divider -->
  <line x1="24" y1="82" x2="456" y2="82" stroke="#2d2d2d" stroke-width="1"/>

  <!-- Footer meta -->
  <text x="24" y="104" font-family="'Helvetica Neue',sans-serif" font-size="12" fill="#9ca3af">Matched to supplier PO #4821  ·  Saved 14 mins manual work</text>
  <text x="24" y="122" font-family="'Helvetica Neue',sans-serif" font-size="11" fill="#52525b">zynextechnologies.com.au</text>
</svg>
